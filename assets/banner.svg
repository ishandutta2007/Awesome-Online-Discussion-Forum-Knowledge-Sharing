<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background:#0b0f19;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing accents -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Badge/Pill Gradients -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" />
  <circle cx="200" cy="80" r="280" fill="url(#glowCyan)" />
  <circle cx="980" cy="240" r="320" fill="url(#glowPurple)" />

  <!-- Animated Ambient Floating Nodes & Grid in Background -->
  <g opacity="0.35">
    <style>
      @keyframes floatSlow1 {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(8px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes floatSlow2 {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(14px) translateX(-10px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.75; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .anim-float1 { animation: floatSlow1 7s ease-in-out infinite; }
      .anim-float2 { animation: floatSlow2 9s ease-in-out infinite; }
      .anim-pulse { animation: pulseGlow 4s ease-in-out infinite; }
      .anim-dash { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
    </style>

    <!-- Subtle Connected Network lines in background -->
    <path class="anim-dash" d="M 120 280 Q 250 180, 420 220 T 780 180 T 1080 260" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <path class="anim-dash" d="M 160 80 Q 400 120, 600 60 T 1050 100" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Animated Background Discussion Bubbles / Cards (kept low opacity and behind text) -->
  <g class="anim-float1">
    <rect x="70" y="55" width="160" height="42" rx="21" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1" />
    <circle cx="92" cy="76" r="6" fill="#38bdf8" />
    <text x="108" y="81" fill="#94a3b8" font-size="13" font-weight="500">💬 Open Forums</text>
  </g>

  <g class="anim-float2">
    <rect x="970" y="60" width="165" height="42" rx="21" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1" />
    <circle cx="992" cy="81" r="6" fill="#c084fc" />
    <text x="1008" y="86" fill="#94a3b8" font-size="13" font-weight="500">🧠 Knowledge Base</text>
  </g>

  <g class="anim-float1">
    <rect x="990" y="240" width="145" height="40" rx="20" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1" />
    <circle cx="1010" cy="260" r="6" fill="#34d399" />
    <text x="1025" y="265" fill="#94a3b8" font-size="13" font-weight="500">⚡ Q&amp;A Systems</text>
  </g>

  <g class="anim-float2">
    <rect x="60" y="240" width="160" height="40" rx="20" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1" />
    <circle cx="80" cy="260" r="6" fill="#f43f5e" />
    <text x="96" y="265" fill="#94a3b8" font-size="13" font-weight="500">🌐 Communities</text>
  </g>

  <!-- Foreground Content: Header, Title, Subtitle, Highlights -->
  <!-- Category Pill Badge -->
  <g transform="translate(485, 38)">
    <rect width="230" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="20" cy="16" r="4" fill="#67e8f9" />
    <text x="32" y="21" fill="#c7d2fe" font-size="12" font-weight="600" letter-spacing="1.2">CURATED AWESOME LIST</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="130" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="800" letter-spacing="-0.5">
    Online Discussion Forum &amp; Knowledge Sharing
  </text>

  <!-- Gradient Underline Accent -->
  <rect x="420" y="148" width="360" height="3.5" rx="1.75" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text x="600" y="185" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="400">
    Top Commercial SaaS &amp; Open-Source Self-Hosted Software Platforms for Modern Communities
  </text>

  <!-- Feature Highlights / Tag Pills in Foreground -->
  <g transform="translate(250, 225)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="150" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="75" y="24" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">🚀 Modern Forums</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="165" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="257" y="24" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">💡 Q&amp;A &amp; Knowledge</text>

    <!-- Pill 3 -->
    <rect x="365" y="0" width="160" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="445" y="24" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600">🛡️ Self-Hosted OSS</text>

    <!-- Pill 4 -->
    <rect x="550" y="0" width="150" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="625" y="24" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="600">☁️ Enterprise SaaS</text>
  </g>

  <!-- Bottom Interactive Status Row -->
  <g transform="translate(420, 290)">
    <circle cx="10" cy="10" r="4" fill="#10b981" />
    <text x="22" y="14" fill="#64748b" font-size="12" font-weight="500">Actively Curated &amp; Maintained • Open Source • Community Driven</text>
  </g>
</svg>
